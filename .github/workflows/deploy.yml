name: Deploy to Production

on:
  push:
    branches: [master]

jobs:
  deploy:
    name: Deploy to greenbricks.net
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 94.72.96.17
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          script: bash /var/www/deploy-greenbricks.sh
