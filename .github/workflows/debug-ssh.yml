name: Debug SSH (temporary)

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Switch server git remote to SSH deploy key
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 94.72.96.17
          username: root
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            mkdir -p ~/.ssh
            chmod 700 ~/.ssh
            cat > ~/.ssh/greenbricks_deploy <<'KEYEOF'
            ${{ secrets.GREENBRICKS_DEPLOY_KEY }}
            KEYEOF
            chmod 600 ~/.ssh/greenbricks_deploy

            cat > ~/.ssh/config <<'CFGEOF'
            Host github.com
              HostName github.com
              User git
              IdentityFile ~/.ssh/greenbricks_deploy
              IdentitiesOnly yes
            CFGEOF
            chmod 600 ~/.ssh/config

            ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null

            git config --global --add safe.directory /var/www/greenbricks
            cd /var/www/greenbricks
            git remote set-url origin git@github.com:navodjayawardhana/property-new.git
            git remote -v
            git fetch origin
            git pull origin master
            echo "--- SUCCESS ---"
